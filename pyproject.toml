[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "newsrec"
version = "0.2.0"
description = "MIND news recommender: leakage-safe offline pipeline, retrieval + LightGBM LambdaRank, FastAPI + Redis service"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "pyarrow>=15,<27",
    "scikit-learn>=1.4,<1.8",
    "lightgbm>=4.3,<5",
    "joblib>=1.3,<2",
]

[project.optional-dependencies]
serve = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "sqlalchemy>=2.0,<3",
    "redis>=5.0,<7",
    "prometheus-client>=0.20,<1",
    "httpx>=0.27,<1",
]
# MiniLM encoder (offline embedding job only; the API never loads it). The upper bounds keep the
# stack compatible with torch 2.1-2.5; newer transformers releases require torch >= 2.6.
embed = [
    "sentence-transformers>=3.0,<4",
    "transformers>=4.41,<4.50",
    "torch>=2.1",
]
dashboard = ["streamlit>=1.35,<2", "plotly>=5.20,<7"]
dev = ["pytest>=8,<10", "fakeredis>=2.23,<3", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
newsrec = "newsrec.cli:main"

[tool.setuptools.packages.find]
include = ["newsrec*", "app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a live Redis at $REDIS_URL (run with -m integration)"]
addopts = "-m 'not integration' -q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["dashboard.py", "feature_engineering.py", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "B905", "E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = false
files = ["newsrec", "app"]
plugins = ["pydantic.mypy"]
